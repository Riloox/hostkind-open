name: DAST baseline (ZAP)

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: URL of a running disposable instance
        required: false
        default: http://127.0.0.1:2121
      start_command:
        description: Command that boots the app to scan
        required: false
        default: node server.js

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare the app
        run: npm run build
      - name: Boot the app
        run: |
          ${{ inputs.start_command || 'node server.js' }} &
          for i in $(seq 1 45); do
            if curl -sf "${{ inputs.target_url || 'http://127.0.0.1:2121' }}" > /dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not come up within 90s" >&2
          exit 1
      - name: ZAP baseline scan (passive)
        run: |
          # The runner's workspace dir is owned by the runner user, while ZAP
          # runs in the container as uid 1000 - without this the report write
          # dies with AccessDeniedException and no artifact is produced.
          mkdir -p "${{ github.workspace }}/zap-out"
          chmod a+rwx "${{ github.workspace }}/zap-out"
          docker run --network host \
            -v "${{ github.workspace }}/zap-out:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ inputs.target_url || 'http://127.0.0.1:2121' }}" \
            -r zap-report.html \
            -I
        # Informational scan: `-I` means WARN-NEW alerts are recorded in the
        # HTML report but do not fail the step (zap-baseline exits 2 on any
        # WARN-NEW by default). Remove `-I` or use `-m 1` if you want the
        # scan itself to fail.
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: zap-out/
          retention-days: 14